<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf - Launching Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <header class="navbar">
            <div class="logo">
                <h2>BOOKSHELF</h2>
            </div>
            <nav class="nav-links">
                <a href="mailto:support@bookshelf.codes">Contact Support</a>
            </nav>
        </header>

        <div class="hero-text">
            <p class="hero-tag">
                <span class="tag-line"></span>
                <span class="tag-text">COMING SOON</span>
            </p>
            <h1 class="hero-title">
                <span>GET READY</span>
                <span>FOR SOMETHING</span>
                <span class="hero-title-last">AMAZING.</span>
            </h1>
            <p class="sub-text">
                We are building the ultimate platform curated for students. 
                Everything exactly where it belongs.
            </p>
            
            <div class="contact-info">
                <p>Have questions? Reach out to us at: <a href="mailto:support@bookshelf.codes" class="email-link">support@bookshelf.codes</a></p>
            </div>
        </div>
        
        <div class="book-animation-container">
            <div class="book">
                <div class="book-cover back-cover"></div>
                <div class="book-page page-left"></div>
                <div class="book-page page-right page-1"></div>
                <div class="book-page page-right page-2"></div>
                <div class="book-page page-right page-3"></div>
                <div class="book-page page-right page-4"></div>
                <div class="book-page page-right page-5"></div>
                <div class="book-cover front-cover">
                    <div class="cover-design">
                        <div class="cover-logo"></div>
                        <h2 class="cover-text">GNE</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
